name: Clean Sneaker Text Overlays Strict

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/prepare_text_overlay_matrix.py'
      - 'scripts/scan_text_overlay_chunk_strict.py'
      - 'scripts/apply_text_overlay_results.py'
      - 'scripts/apply_text_overlay_results_strict.py'
      - '.github/workflows/clean-sneaker-text-overlays.yml'

permissions:
  contents: write

env:
  OCR_CHUNK_SIZE: '80'
  RUN_REQUEST: '2026-08-02T22:36:30+08:00'

concurrency:
  group: clean-sneaker-text-overlays-strict
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      batch_count: ${{ steps.matrix.outputs.batch_count }}
      product_total: ${{ steps.matrix.outputs.product_total }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Mark strict cleanup as running
        shell: bash
        run: |
          mkdir -p qiqishoes-com/assets/tennis-shoes
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          Path('qiqishoes-com/assets/tennis-shoes/text-overlay-cleanup-status.json').write_text(
              json.dumps({
                  'status': 'running',
                  'mode': 'strict-fast-any-visible-latin-or-digit',
                  'startedAt': datetime.now(timezone.utc).isoformat(),
                  'scope': 'all sneaker categories only'
              }, ensure_ascii=False, indent=2),
              encoding='utf-8'
          )
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qiqishoes-com/assets/tennis-shoes/text-overlay-cleanup-status.json
          if ! git diff --cached --quiet; then
            git commit -m 'Mark fast strict sneaker cleanup running'
            git pull --rebase origin main
            git push
          fi
      - name: Build strict OCR batch matrix
        id: matrix
        run: python scripts/prepare_text_overlay_matrix.py

  scan:
    needs: prepare
    if: ${{ needs.prepare.outputs.batch_count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 40
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install OCR dependencies
        shell: bash
        run: |
          if ! command -v tesseract >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-eng
          fi
          python -m pip install --quiet pillow pytesseract
      - name: Strictly scan category batch
        run: |
          mkdir -p scan-output
          python scripts/scan_text_overlay_chunk_strict.py \
            --category '${{ matrix.category }}' \
            --start '${{ matrix.start }}' \
            --end '${{ matrix.end }}' \
            --output 'scan-output/${{ matrix.category }}-${{ matrix.start }}.json'
      - name: Upload strict scan result
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: strict-scan-${{ matrix.category }}-${{ matrix.start }}
          path: scan-output/*.json
          if-no-files-found: error
          retention-days: 2

  apply:
    needs: [prepare, scan]
    if: ${{ always() && needs.prepare.outputs.batch_count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download every strict scan result
        uses: actions/download-artifact@v4
        with:
          pattern: strict-scan-*
          path: scan-results
          merge-multiple: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply strict cleanup and delete image files
        run: python scripts/apply_text_overlay_results_strict.py
      - name: Commit cleaned sneaker catalogs
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qiqishoes-com/assets/tennis-shoes
          if ! git diff --cached --quiet; then
            git commit -m 'Strictly remove text-overlay sneaker products'
            git pull --rebase origin main
            git push
          fi
