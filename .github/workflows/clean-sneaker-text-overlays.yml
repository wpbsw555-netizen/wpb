name: Clean Sneaker Text Overlays

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/prepare_text_overlay_matrix.py'
      - 'scripts/scan_text_overlay_chunk.py'
      - 'scripts/apply_text_overlay_results.py'
      - '.github/workflows/clean-sneaker-text-overlays.yml'

permissions:
  contents: write

env:
  OCR_CHUNK_SIZE: '180'
  RUN_REQUEST: '2026-08-02T17:18:00+08:00'

concurrency:
  group: clean-sneaker-text-overlays-parallel
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      batch_count: ${{ steps.matrix.outputs.batch_count }}
      product_total: ${{ steps.matrix.outputs.product_total }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Mark cleanup as running
        shell: bash
        run: |
          mkdir -p qiqishoes-com/assets/tennis-shoes
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          Path('qiqishoes-com/assets/tennis-shoes/text-overlay-cleanup-status.json').write_text(
              json.dumps({
                  'status': 'running',
                  'startedAt': datetime.now(timezone.utc).isoformat(),
                  'scope': 'all sneaker categories only'
              }, ensure_ascii=False, indent=2),
              encoding='utf-8'
          )
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qiqishoes-com/assets/tennis-shoes/text-overlay-cleanup-status.json
          if ! git diff --cached --quiet; then
            git commit -m 'Mark sneaker text-overlay cleanup running'
            git pull --rebase origin main
            git push
          fi
      - name: Build OCR batch matrix
        id: matrix
        run: python scripts/prepare_text_overlay_matrix.py

  scan:
    needs: prepare
    if: ${{ needs.prepare.outputs.batch_count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install OCR
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-eng
          python -m pip install --quiet pillow pytesseract
      - name: Scan category batch
        run: |
          mkdir -p scan-output
          python scripts/scan_text_overlay_chunk.py \
            --category '${{ matrix.category }}' \
            --start '${{ matrix.start }}' \
            --end '${{ matrix.end }}' \
            --output 'scan-output/${{ matrix.category }}-${{ matrix.start }}.json'
      - name: Upload scan result
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: scan-${{ matrix.category }}-${{ matrix.start }}
          path: scan-output/*.json
          if-no-files-found: warn
          retention-days: 2

  apply:
    needs: [prepare, scan]
    if: ${{ always() && needs.prepare.outputs.batch_count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout latest repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download every scan result
        uses: actions/download-artifact@v4
        with:
          pattern: scan-*
          path: scan-results
          merge-multiple: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply cleanup results
        run: python scripts/apply_text_overlay_results.py
      - name: Mark cleanup as completed
        shell: bash
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          report_path = Path('qiqishoes-com/assets/tennis-shoes/text-overlay-cleanup-report.json')
          report = json.loads(report_path.read_text(encoding='utf-8')) if report_path.exists() else {}
          Path('qiqishoes-com/assets/tennis-shoes/text-overlay-cleanup-status.json').write_text(
              json.dumps({
                  'status': 'completed',
                  'completedAt': datetime.now(timezone.utc).isoformat(),
                  'scanned': report.get('scanned', 0),
                  'removed': report.get('removed', 0),
                  'scanErrors': report.get('scanErrors', 0)
              }, ensure_ascii=False, indent=2),
              encoding='utf-8'
          )
          PY
      - name: Commit cleaned sneaker catalogs
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qiqishoes-com/assets/tennis-shoes
          if ! git diff --cached --quiet; then
            git commit -m 'Remove text-overlay products from sneaker catalogs'
            git pull --rebase origin main
            git push
          fi
