name: Purge Sneaker Catalog

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/clean-sneaker-text-overlays.yml'

permissions:
  contents: write

concurrency:
  group: clean-sneaker-text-overlays-strict
  cancel-in-progress: true

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove every sneaker product, image and category
        shell: bash
        run: |
          rm -rf qiqishoes-com/assets/tennis-shoes
          mkdir -p qiqishoes-com/assets/tennis-shoes
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          payload = {
              'generatedAt': datetime.now(timezone.utc).isoformat(),
              'cleared': True,
              'defaultCategory': None,
              'categoryCount': 0,
              'importedCategoryCount': 0,
              'totalProducts': 0,
              'categories': []
          }
          Path('qiqishoes-com/assets/tennis-shoes/catalog.json').write_text(
              json.dumps(payload, ensure_ascii=False, indent=2),
              encoding='utf-8'
          )
          PY

      - name: Commit empty sneaker catalog
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A qiqishoes-com/assets/tennis-shoes
          if ! git diff --cached --quiet; then
            git commit -m 'Remove all sneaker products images and categories'
            git pull --rebase origin main
            git push
          fi
