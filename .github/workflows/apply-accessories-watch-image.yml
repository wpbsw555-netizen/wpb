name: Apply Accessories Watch Image

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-accessories-watch-image.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create neutral accessories image asset
        shell: bash
        run: |
          set -euo pipefail
          cp qiqishoes-com/assets/catalog/accessories/rolex-accessories-home-20260815.jpg qiqishoes-com/assets/catalog/accessories/acc-home-card-20260815.jpg
          test -s qiqishoes-com/assets/catalog/accessories/acc-home-card-20260815.jpg
          test "$(file -b --mime-type qiqishoes-com/assets/catalog/accessories/acc-home-card-20260815.jpg)" = "image/jpeg"

      - name: Point homepage card to neutral static image with fallback
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('qiqishoes-com/index.html')
          s = p.read_text()
          pattern = r'<img class="dept-bg" src="[^"]+" alt="[^"]*" loading="eager" decoding="(?:async|sync)">'
          replacement = '<img class="dept-bg" src="/assets/catalog/accessories/acc-home-card-20260815.jpg?v=202608152040" alt="Accessories watch" loading="eager" onerror="this.onerror=null;this.src=\'/assets/catalog/accessories/16511.jpg?v=202608152040\'">'
          s2, n = re.subn(pattern, replacement, s, count=1)
          if n != 1:
              raise SystemExit(f'Expected one accessories image element, replaced {n}')
          p.write_text(s2)
          PY

      - name: Commit neutral image fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qiqishoes-com/index.html qiqishoes-com/assets/catalog/accessories/acc-home-card-20260815.jpg
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Fix accessories image with neutral URL and fallback'
          git push
