name: Apply Accessories Watch Image

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-accessories-watch-image.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Embed accessories watch directly into homepage
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          html_path = Path('qiqishoes-com/index.html')
          b64_path = Path('qiqishoes-com/assets/catalog/accessories/rolex-watch-card-300.b64')

          s = html_path.read_text()
          b64 = ''.join(b64_path.read_text().split())
          if not b64.startswith('/9j/'):
              raise SystemExit('Watch image base64 is not a JPEG')

          data_uri = 'data:image/jpeg;base64,' + b64
          pattern = r'(<img class="dept-bg" src=")[^"]+(" alt="" loading="eager" decoding="async">)'
          s2, n = re.subn(pattern, lambda m: m.group(1) + data_uri + m.group(2), s, count=1)
          if n != 1:
              raise SystemExit(f'Expected one accessories image element, replaced {n}')

          html_path.write_text(s2)
          PY

      - name: Commit embedded accessories image
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qiqishoes-com/index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Embed accessories watch image directly in homepage'
          git push
