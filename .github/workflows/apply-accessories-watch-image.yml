name: Apply Accessories Watch Image

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-accessories-watch-image.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Force a fresh accessories image URL
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('qiqishoes-com/index.html')
          s = p.read_text()
          old = './assets/catalog/accessories/rolex-watch-card-300.jpg?v=202608140340'
          new = './assets/catalog/accessories/rolex-watch-card-300.jpg?v=202608141051'
          if old not in s:
              raise SystemExit('Old accessories image URL not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Commit cache-busting image URL
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qiqishoes-com/index.html
          git commit -m 'Bust accessories watch image cache'
          git push
