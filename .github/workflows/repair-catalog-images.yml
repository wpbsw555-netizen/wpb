name: Repair Catalog Images

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-catalog-images.yml'

permissions:
  contents: write

concurrency:
  group: repair-catalog-images
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Repair missing or invalid catalog thumbnails
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import concurrent.futures, html, json, re, shutil, ssl, urllib.parse, urllib.request

          root = Path('qiqishoes-com')
          data_path = root / 'assets/catalog/catalog-data.json'
          data = json.loads(data_path.read_text(encoding='utf-8'))
          departments = data.get('departments', {})
          ua = 'Mozilla/5.0 (compatible; QIQI-Catalog-Repair/1.0)'
          ctx = ssl.create_default_context()

          fallback_ids = {'fashion':'3','accessories':'16511','bags':'29314','shoes':'355'}

          def magic_ok(raw):
              if len(raw) < 700: return False
              return raw.startswith(b'\xff\xd8\xff') or raw.startswith(b'\x89PNG\r\n\x1a\n') or raw[:6] in (b'GIF87a', b'GIF89a') or (len(raw) > 12 and raw[8:12] == b'WEBP')

          def file_ok(path):
              try:
                  return magic_ok(path.read_bytes()[:4096]) and path.stat().st_size > 700
              except Exception:
                  return False

          def fetch_bytes(url, referer=None, timeout=28):
              headers={'User-Agent':ua,'Accept':'image/avif,image/webp,image/apng,image/*,*/*;q=0.8'}
              if referer: headers['Referer']=referer
              req=urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=timeout, context=ctx) as r:
                  raw=r.read()
                  return raw, r.headers.get('content-type',''), r.url

          def find_product_image(landing):
              req=urllib.request.Request(landing, headers={'User-Agent':ua,'Accept':'text/html,*/*'})
              with urllib.request.urlopen(req, timeout=30, context=ctx) as r:
                  raw=r.read(); final=r.url; ctype=(r.headers.get('content-type') or '').lower()
              enc='gb18030' if ('gb2312' in ctype or 'gbk' in ctype) else 'utf-8'
              text=raw.decode(enc,'replace')
              for tag in re.findall(r'<img\b[^>]*>', text, flags=re.I):
                  for attr in ('data-original','data-src','data-lazy-src','src'):
                      m=re.search(rf'''\b{attr}\s*=\s*(["'])(.*?)\1''', tag, flags=re.I|re.S)
                      if not m: continue
                      u=urllib.parse.urljoin(final, html.unescape(m.group(2).strip()))
                      if '/upfile/category/' in urllib.parse.urlparse(u).path.lower():
                          return u, final
              return None, final

          targets=[]
          total=0
          for dept, block in departments.items():
              for item in block.get('items', []):
                  total += 1
                  rel=item.get('image','')
                  if not rel: continue
                  path=root / rel
                  if not file_ok(path):
                      targets.append((dept,item,path))

          print(f'Total catalog thumbnails: {total}; need repair: {len(targets)}')

          def repair_one(entry):
              dept,item,path=entry
              landing=item.get('landing') or ''
              try:
                  img_url, referer = find_product_image(landing)
                  if img_url:
                      raw, ctype, final = fetch_bytes(img_url, referer)
                      if magic_ok(raw):
                          path.parent.mkdir(parents=True, exist_ok=True)
                          path.write_bytes(raw)
                          return ('downloaded', dept, str(item.get('id')), str(path), len(raw))
              except Exception as e:
                  err=repr(e)
              else:
                  err='no product image found'

              fallback = root / f'assets/catalog/{dept}/{fallback_ids.get(dept, "")}.jpg'
              if file_ok(fallback):
                  path.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(fallback, path)
                  return ('fallback', dept, str(item.get('id')), str(path), path.stat().st_size)
              return ('failed', dept, str(item.get('id')), str(path), err)

          results=[]
          if targets:
              with concurrent.futures.ThreadPoolExecutor(max_workers=10) as ex:
                  for result in ex.map(repair_one, targets):
                      results.append(result)
                      print(result)

          missing=[]
          for dept, block in departments.items():
              for item in block.get('items', []):
                  rel=item.get('image','')
                  if rel and not file_ok(root/rel):
                      missing.append((dept,item.get('id'),rel))

          downloaded=sum(1 for r in results if r[0]=='downloaded')
          fallback=sum(1 for r in results if r[0]=='fallback')
          failed=sum(1 for r in results if r[0]=='failed')
          print(f'Repair summary downloaded={downloaded} fallback={fallback} failed={failed} remaining_invalid={len(missing)}')
          if missing:
              raise SystemExit('Some catalog thumbnails are still invalid: '+repr(missing[:20]))
          PY

      - name: Commit repaired images
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qiqishoes-com/assets/catalog
          if git diff --cached --quiet; then
            echo 'No catalog thumbnail changes needed.'
          else
            git commit -m 'Repair local catalog thumbnails'
            git push origin main
          fi

      - name: Verify live catalog thumbnail delivery
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            ok=1
            for u in \
              'https://qiqishoes-com.pages.dev/assets/catalog/fashion/3.jpg' \
              'https://qiqishoes-com.pages.dev/assets/catalog/accessories/16511.jpg' \
              'https://qiqishoes-com.pages.dev/assets/catalog/bags/29314.jpg' \
              'https://qiqishoes-com.pages.dev/assets/catalog/shoes/355.jpg'; do
              code=$(curl -sS -L --max-time 20 -o /tmp/thumb -w '%{http_code}' "$u?verify=$i" || true)
              if [ "$code" != '200' ] || [ "$(wc -c < /tmp/thumb 2>/dev/null || echo 0)" -lt 700 ]; then ok=0; break; fi
            done
            if [ "$ok" = '1' ]; then
              echo 'LIVE LOCAL THUMBNAILS VERIFIED'
              exit 0
            fi
            sleep 5
          done
          echo 'Local catalog thumbnails did not verify in time' >&2
          exit 1
