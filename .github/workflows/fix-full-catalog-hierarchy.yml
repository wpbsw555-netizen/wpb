name: Fix Full Catalog Hierarchy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-full-catalog-hierarchy.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Preserve child categories and all image hosts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('functions/local-catalog.js')
          s=p.read_text(encoding='utf-8')

          # Accept the original site's image CDN as well as the catalog host.
          s=re.sub(
              r"function isAllowedImage\(url, expectedHost\) \{[\s\S]*?\n\}",
              """function isAllowedImage(url, expectedHost) {
            if (!(url instanceof URL) || url.protocol !== 'https:') return false;
            const host = url.hostname.toLowerCase();
            const expected = String(expectedHost || '').toLowerCase();
            const hostOk = host === expected || host === 'qiqiyg.com' || host.endsWith('.qiqiyg.com');
            return hostOk && url.pathname.toLowerCase().includes('/upfile/category/');
          }""",
              s, count=1)

          # Keep child category IDs from the static snapshots.
          old="items.push({ url: u.href, alt: String(item.alt || '') });"
          new="items.push({ url: u.href, alt: String(item.alt || ''), childId: /^\\d+$/.test(String(item.childId || '')) ? String(item.childId) : null });"
          if old not in s and 'childId:' not in s:
              raise SystemExit('snapshot item insertion point not found')
          s=s.replace(old,new,1)

          # Replace live parser so it captures the original category link attached to each image.
          start=s.index('async function loadLiveItems(config, id) {')
          end=s.index('\n\nfunction pageUrl(', start)
          live=r'''async function loadLiveItems(config, id) {
            const target = new URL(`https://${config.host}/categoryen_${id}.html`);
            target.searchParams.set('path', `0_${id}`);
            const upstream = await fetch(target.href, {
              redirect: 'follow',
              headers: {
                'User-Agent': 'Mozilla/5.0 (compatible; QIQI-Catalog/4.0)',
                'Accept': 'text/html,application/xhtml+xml,*/*;q=0.8',
                'Accept-Language': 'en-US,en;q=0.9',
                'Referer': `https://${config.host}/`
              },
              cf: { cacheEverything: true, cacheTtl: EDGE_TTL }
            });
            if (!upstream.ok) throw new Error(`Catalog source returned ${upstream.status}`);
            const finalUrl = new URL(upstream.url || target.href);
            if (finalUrl.hostname.toLowerCase() !== config.host) throw new Error('Unexpected catalog redirect');
            const text = await upstream.text();
            const decode = (v) => String(v || '').replace(/&amp;/gi, '&').replace(/&#39;/gi, "'").replace(/&quot;/gi, '"');
            const attr = (tag, name) => {
              const m = tag.match(new RegExp(`\\b${name}\\s*=\\s*(["'])(.*?)\\1`, 'is'));
              return m ? decode(m[2].trim()) : '';
            };
            const imageFromTag = (tag) => attr(tag,'data-original') || attr(tag,'data-src') || attr(tag,'data-lazy-src') || attr(tag,'src');
            const items=[];
            const seen=new Set();
            const anchorRe=/<a\b[^>]*href=["']([^"']+)["'][^>]*>([\s\S]*?)<\/a>/gi;
            let m;
            while ((m=anchorRe.exec(text))) {
              const href=decode(m[1]);
              const imgMatch=m[2].match(/<img\b[^>]*>/i);
              if (!imgMatch) continue;
              const raw=imageFromTag(imgMatch[0]);
              if (!raw) continue;
              let image;
              try { image=new URL(raw, finalUrl); } catch { continue; }
              if (!isAllowedImage(image, config.host) || seen.has(image.href)) continue;
              seen.add(image.href);
              const childMatch=href.match(/categoryen_(\d+)\.html/i);
              const alt=attr(imgMatch[0],'alt');
              items.push({url:image.href, alt, childId:childMatch ? childMatch[1] : null});
            }
            if (items.length) return items;
            const imgRe=/<img\b[^>]*>/gi;
            while ((m=imgRe.exec(text))) {
              const raw=imageFromTag(m[0]);
              if (!raw) continue;
              let image;
              try { image=new URL(raw, finalUrl); } catch { continue; }
              if (!isAllowedImage(image, config.host) || seen.has(image.href)) continue;
              seen.add(image.href);
              items.push({url:image.href, alt:attr(m[0],'alt'), childId:null});
            }
            return items;
          }'''
          s=s[:start]+live+s[end:]

          # Replace card rendering: category images navigate deeper inside QIQI; leaf product images still zoom.
          start=s.index('  const cards = items.map((item, offset) => {')
          end=s.index("  }).join('');", start)+len("  }).join('');")
          cards=r'''  const cards = items.map((item, offset) => {
            const globalIndex = (page - 1) * PAGE_SIZE + offset;
            const proxied = `${origin}/catalog-proxy?u=${encodeURIComponent(item.url)}&fallback=${encodeURIComponent(localFallback)}`;
            const productName = item.alt || `Product ${String(globalIndex + 1).padStart(3, '0')}`;
            const waText = `Hello, I want a quote for ${dept} category ${id}, item ${globalIndex + 1}.`;
            const priority = offset < 4 ? 'eager' : 'lazy';
            const fetchPriority = offset < 3 ? 'high' : 'auto';
            const childHref = item.childId ? pageUrl(origin, dept, item.childId, 1) : '';
            const imageMarkup = childHref
              ? `<a class="image-button" href="${esc(childHref)}" aria-label="View all styles in ${esc(productName)}"><img src="${esc(proxied)}" data-fallback="${esc(localFallback)}" data-default="${esc(defaultFallback)}" alt="${esc(productName)}" loading="${priority}" fetchpriority="${fetchPriority}" decoding="async" width="520" height="520"></a>`
              : `<button class="image-button" type="button" data-name="${esc(productName)}" aria-label="View ${esc(productName)}"><img src="${esc(proxied)}" data-fallback="${esc(localFallback)}" data-default="${esc(defaultFallback)}" alt="${esc(productName)}" loading="${priority}" fetchpriority="${fetchPriority}" decoding="async" width="520" height="520"></button>`;
            const actionMarkup = childHref
              ? `<a class="quote" href="${esc(childHref)}">查看全部款式 / View All Styles →</a>`
              : `<a class="quote" href="https://wa.me/${WHATSAPP}?text=${encodeURIComponent(waText)}" target="_blank" rel="noopener noreferrer">WhatsApp 询价 / Quote</a>`;
            return `<article class="product-card">${imageMarkup}<div class="product-meta"><strong>${childHref ? `<a href="${esc(childHref)}" style="color:inherit;text-decoration:none">${esc(productName)}</a>` : esc(productName)}</strong><span>ID ${esc(id)}-${globalIndex + 1}${item.childId ? ` · CAT ${esc(item.childId)}` : ''}</span>${actionMarkup}</div></article>`;
          }).join('');'''
          s=s[:start]+cards+s[end:]

          # Do not hijack category links with the zoom modal.
          s=s.replace("document.querySelectorAll('.image-button').forEach(b=>b.addEventListener('click'", "document.querySelectorAll('button.image-button').forEach(b=>b.addEventListener('click'", 1)
          s=s.replace("const CACHE_VERSION = '20260817b';", "const CACHE_VERSION = '20260817c';", 1)
          p.write_text(s,encoding='utf-8')

          # Allow QIQI image CDN through the same-site image proxy.
          q=Path('functions/catalog-proxy.js')
          x=q.read_text(encoding='utf-8')
          old="return host === 'tangma2088.com' || host.endsWith('.tangma2088.com');"
          new="return host === 'tangma2088.com' || host.endsWith('.tangma2088.com') || host === 'qiqiyg.com' || host.endsWith('.qiqiyg.com');"
          if old not in x and "host.endsWith('.qiqiyg.com')" not in x:
              raise SystemExit('proxy allowlist insertion point not found')
          x=x.replace(old,new,1)
          q.write_text(x,encoding='utf-8')
          PY
          grep -q "CACHE_VERSION = '20260817c'" functions/local-catalog.js
          grep -q 'View All Styles' functions/local-catalog.js
          grep -q "host.endsWith('.qiqiyg.com')" functions/catalog-proxy.js

      - name: Rebuild top-level snapshots with child links
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import concurrent.futures, html, json, re, ssl, time, urllib.parse, urllib.request
          root=Path('qiqishoes-com')
          data=json.loads((root/'assets/catalog/catalog-data.json').read_text(encoding='utf-8'))
          out_root=root/'assets/catalog/products'
          ctx=ssl.create_default_context(); ua='Mozilla/5.0 (compatible; QIQI-Hierarchy/1.0)'
          jobs=[]
          for dept,block in data.get('departments',{}).items():
              for item in block.get('items',[]):
                  if item.get('landing') and item.get('id'): jobs.append((dept,str(item['id']),item['landing']))

          def fetch_page(url):
              last=None
              for attempt in range(3):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':ua,'Accept':'text/html,*/*'})
                      with urllib.request.urlopen(req,timeout=35,context=ctx) as r:
                          raw=r.read(); final=r.url; ct=(r.headers.get('content-type') or '').lower()
                      enc='gb18030' if ('gb2312' in ct or 'gbk' in ct) else 'utf-8'
                      return raw.decode(enc,'replace'), final
                  except Exception as e:
                      last=e; time.sleep(1+attempt)
              raise last

          def attr(tag,name):
              m=re.search(rf'''\b{name}\s*=\s*(["'])(.*?)\1''',tag,re.I|re.S)
              return html.unescape(m.group(2).strip()) if m else ''

          def allowed_image(u,expected):
              p=urllib.parse.urlparse(u); h=(p.hostname or '').lower()
              return p.scheme=='https' and (h==expected or h=='qiqiyg.com' or h.endswith('.qiqiyg.com')) and '/upfile/category/' in p.path.lower()

          def one(job):
              dept,id_,landing=job; dest=out_root/dept/f'{id_}.json'
              try:
                  text,final=fetch_page(landing); expected=(urllib.parse.urlparse(final).hostname or '').lower()
                  items=[]; seen=set()
                  for href,inner in re.findall(r'<a\b[^>]*href=["\']([^"\']+)["\'][^>]*>(.*?)</a>',text,re.I|re.S):
                      im=re.search(r'<img\b[^>]*>',inner,re.I|re.S)
                      if not im: continue
                      tag=im.group(0); raw=attr(tag,'data-original') or attr(tag,'data-src') or attr(tag,'data-lazy-src') or attr(tag,'src')
                      if not raw: continue
                      u=urllib.parse.urljoin(final,raw)
                      if not allowed_image(u,expected) or u in seen: continue
                      seen.add(u)
                      cm=re.search(r'categoryen_(\d+)\.html',html.unescape(href),re.I)
                      items.append({'url':u,'alt':attr(tag,'alt'),'childId':cm.group(1) if cm else None})
                  if not items: raise RuntimeError('no catalog cards')
                  payload={'department':dept,'id':id_,'source':final,'count':len(items),'items':items}
                  dest.parent.mkdir(parents=True,exist_ok=True); dest.write_text(json.dumps(payload,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
                  return dept,id_,len(items),sum(1 for i in items if i.get('childId')),'ok'
              except Exception as e:
                  old={}
                  if dest.exists():
                      try: old=json.loads(dest.read_text(encoding='utf-8'))
                      except: pass
                  return dept,id_,len(old.get('items',[])),sum(1 for i in old.get('items',[]) if i.get('childId')),'kept:'+repr(e)

          results=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=12) as ex:
              for r in ex.map(one,jobs): results.append(r)
          total=sum(r[2] for r in results); linked=sum(r[3] for r in results); bad=[r for r in results if r[2]==0]
          print('HIERARCHY SNAPSHOTS',len(results),'cards',total,'child-links',linked,'empty',len(bad))
          sample=out_root/'fashion/11.json'
          d=json.loads(sample.read_text(encoding='utf-8'))
          print('FASHION 11 count',len(d.get('items',[])),'linked',sum(1 for i in d.get('items',[]) if i.get('childId')))
          if bad or len(d.get('items',[])) < 100 or sum(1 for i in d.get('items',[]) if i.get('childId')) < 100:
              raise SystemExit('Hierarchy snapshot coverage insufficient')
          PY

      - name: Commit hierarchy fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add functions/local-catalog.js functions/catalog-proxy.js qiqishoes-com/assets/catalog/products
          git commit -m 'Preserve full original catalog hierarchy and styles'
          git push origin main

      - name: Verify full style navigation live
        shell: bash
        run: |
          python - <<'PY'
          import html,re,time,urllib.request,urllib.parse
          origin='https://qiqishoes-com.pages.dev'
          def get(url,timeout=35):
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=timeout) as r: return r.status,r.read(),r.url
          # Wait for new version and verify parent category has all 100+ cards and local child links.
          for attempt in range(120):
              try:
                  st,b,_=get(origin+'/local-catalog?dept=fashion&id=11&page=1')
                  t=b.decode('utf-8','replace')
                  if st==200 and 'View All Styles' in t and '133' in t:
                      print('new hierarchy live after',attempt,'checks'); break
              except Exception as e: print('wait',attempt,repr(e))
              time.sleep(5)
          else: raise SystemExit('new hierarchy did not publish')
          child_links=[html.unescape(x) for x in re.findall(r'href=["\']([^"\']+)',t,re.I) if '/local-catalog?' in html.unescape(x)]
          if not child_links: raise SystemExit('no local child links')
          first=next((u for u in child_links if 'id=221376' in u),child_links[0])
          if first.startswith('/'): first=origin+first
          st2,b2,_=get(first); t2=b2.decode('utf-8','replace')
          links2=[html.unescape(x) for x in re.findall(r'href=["\']([^"\']+)',t2,re.I) if '/local-catalog?' in html.unescape(x)]
          print('parent child links',len(child_links),'child page local links',len(links2))
          if st2!=200 or not links2: raise SystemExit('second catalog level not navigable')
          # Open a known leaf and ensure many styles are visible/paginated locally.
          leaf=origin+'/local-catalog?dept=fashion&id=364552&page=1'
          st3,b3,_=get(leaf); t3=b3.decode('utf-8','replace')
          imgs=re.findall(r'<img\b[^>]*src=["\']([^"\']+)',t3,re.I)
          if st3!=200 or len(imgs)<20 or '下一页 / Next' not in t3:
              raise SystemExit('leaf style gallery incomplete')
          bad=[]
          for m in re.finditer(r'<a\b[^>]*href=["\']([^"\']+)',t3,re.I):
              u=html.unescape(m.group(1))
              if u.startswith(('http://','https://')):
                  host=(urllib.parse.urlparse(u).hostname or '').lower()
                  if host not in {'qiqishoes-com.pages.dev','wa.me'}: bad.append(u)
          if bad: raise SystemExit('external links remain: '+repr(bad[:3]))
          print('FULL ORIGINAL STYLE NAVIGATION VERIFIED')
          PY
