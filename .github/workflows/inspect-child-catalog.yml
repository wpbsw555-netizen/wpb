name: Inspect Child Catalog

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-child-catalog.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect child category
        run: |
          python - <<'PY'
          import re,html,urllib.request
          for url in ['https://www.tangma2088.com/categoryen_221376.html?path=0_11_221376','https://www.tangma2088.com/categoryen_24784.html?path=0_11_24784']:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=30) as r:
                  raw=r.read(); ct=(r.headers.get('content-type') or '').lower(); final=r.url
              enc='gb18030' if ('gb2312' in ct or 'gbk' in ct) else 'utf-8'
              text=raw.decode(enc,'replace')
              print('\nURL',url,'LEN',len(text))
              cards=[]
              for href,inner in re.findall(r'<a\b[^>]*href=["\']([^"\']+)["\'][^>]*>(.*?)</a>',text,re.I|re.S):
                  m=re.search(r'<img\b[^>]*(?:data-original|data-src|src)=["\']([^"\']+)',inner,re.I|re.S)
                  if not m: continue
                  altm=re.search(r'<img\b[^>]*alt=["\']([^"\']*)',inner,re.I|re.S)
                  cards.append((html.unescape(href),html.unescape(m.group(1)),html.unescape(altm.group(1)) if altm else ''))
              for i,c in enumerate(cards[:15]): print('CARD',i,'HREF=',c[0],'IMG=',c[1],'ALT=',c[2])
              pats={}
              for h in re.findall(r'href=["\']([^"\']+)',text,re.I):
                  h=html.unescape(h); key='other'
                  if 'categoryen_' in h:key='category'
                  elif 'prodetails' in h.lower() or 'product' in h.lower() or 'prodetail' in h.lower():key='product'
                  pats[key]=pats.get(key,0)+1
              print('PATTERNS',pats,'CARDS',len(cards))
          PY
