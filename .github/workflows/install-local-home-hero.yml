name: Install Clean AJ4 Hero

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/aj4-final-clean-20260817.b64'
      - '.github/workflows/install-local-home-hero.yml'

permissions:
  contents: write

concurrency:
  group: install-clean-aj4-hero
  cancel-in-progress: true

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode and verify clean AJ4 JPEG
        shell: bash
        run: |
          set -euo pipefail
          out='qiqishoes-com/assets/aj4-black-home-clean-20260817.jpg'
          tr -d '\r\n' < scripts/aj4-final-clean-20260817.b64 | base64 --decode > "$out"
          test "$(wc -c < "$out")" -eq 92143
          test "$(sha256sum "$out" | cut -d' ' -f1)" = '98bf74fdc550fc1f4553044cf8b3220bfaa25c49938ed731dccd0c1abe45732c'
          file "$out" | grep -qi 'JPEG image data'
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          p='qiqishoes-com/assets/aj4-black-home-clean-20260817.jpg'
          im=Image.open(p)
          im.verify()
          im=Image.open(p)
          print('local hero', im.format, im.size)
          if im.format != 'JPEG' or im.size != (1000,605):
              raise SystemExit(f'Unexpected hero image: {im.format} {im.size}')
          PY

      - name: Update homepage hero reference
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('qiqishoes-com/index.html')
          s=p.read_text(encoding='utf-8')
          new='src="./assets/aj4-black-home-clean-20260817.jpg?v=202608170135" alt="黑色 AJ4 鞋款" width="1000" height="605"'
          pattern=r'src="\./assets/aj4-black[^\"]+" alt="黑色 AJ4 鞋款" width="\d+" height="\d+"'
          s2,n=re.subn(pattern,new,s,count=1)
          if n != 1:
              raise SystemExit('Hero image tag not found')
          p.write_text(s2,encoding='utf-8')
          PY

      - name: Commit clean hero image
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qiqishoes-com/assets/aj4-black-home-clean-20260817.jpg qiqishoes-com/index.html
          git commit -m 'Use clean AJ4 JPEG on homepage'
          git pull --rebase origin main
          git push

      - name: Verify Cloudflare serves exact clean JPEG
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          for i in $(seq 1 72); do
            page=$(curl -fsS --max-time 12 -H 'Cache-Control: no-cache' "https://qiqishoes-com.pages.dev/?v=202608170135${i}" || true)
            if echo "$page" | grep -q 'aj4-black-home-clean-20260817.jpg?v=202608170135'; then
              curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "https://qiqishoes-com.pages.dev/assets/aj4-black-home-clean-20260817.jpg?v=202608170135${i}" -o /tmp/live.jpg
              test "$(wc -c < /tmp/live.jpg)" -eq 92143
              test "$(sha256sum /tmp/live.jpg | cut -d' ' -f1)" = '98bf74fdc550fc1f4553044cf8b3220bfaa25c49938ed731dccd0c1abe45732c'
              python - <<'PY'
          from PIL import Image
          p='/tmp/live.jpg'
          im=Image.open(p)
          im.verify()
          im=Image.open(p)
          if im.format != 'JPEG' or im.size != (1000,605):
              raise SystemExit(f'Bad live hero: {im.format} {im.size}')
          print('live hero verified', im.format, im.size)
          PY
              exit 0
            fi
            sleep 5
          done
          echo 'Cloudflare did not publish the clean AJ4 JPEG in time' >&2
          exit 1
