name: Install Local Homepage Hero

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/home-hero-final.part*'
      - '.github/workflows/install-local-home-hero.yml'

permissions:
  contents: write

env:
  RUN_REQUEST: '2026-08-03T23:48:00+08:00'

concurrency:
  group: install-local-home-hero
  cancel-in-progress: true

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble and verify local JPEG
        shell: bash
        run: |
          cat scripts/home-hero-final.part0 \
              scripts/home-hero-final.part1 \
              scripts/home-hero-final.part2 \
              scripts/home-hero-final.part3 \
            | tr -d '\r\n' \
            | base64 --decode \
            > qiqishoes-com/assets/home-hero-final.jpg
          file qiqishoes-com/assets/home-hero-final.jpg
          test "$(sha256sum qiqishoes-com/assets/home-hero-final.jpg | cut -d' ' -f1)" = "60bb2bcf8da08ae88edaac6114b2264fecb2ef711b7e6fdea29e05716109cba1"

      - name: Point homepage to verified local image
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('qiqishoes-com/index.html')
          text = path.read_text(encoding='utf-8')
          local_url = 'url("./assets/home-hero-final.jpg?v=202608032348")'

          text = re.sub(
              r'url\("https://static\.flexdog\.hu/flexdog-e/products/images/1ccabe62-9ed5-4d98-b414-410aaf6bfc6a\.jpg\?quality=90&width=(?:1600|1200)"\)',
              local_url,
              text,
          )
          text = re.sub(
              r'url\("\./assets/home-hero-user\.svg\?v=[^"]+"\)',
              local_url,
              text,
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit verified local homepage hero
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qiqishoes-com/assets/home-hero-final.jpg qiqishoes-com/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Use verified local high-resolution homepage hero'
            git pull --rebase origin main
            git push
          fi
