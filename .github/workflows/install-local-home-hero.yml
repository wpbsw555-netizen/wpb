name: Restore Verified AJ4 Hero

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-local-home-hero.yml'

permissions:
  contents: write

concurrency:
  group: restore-verified-aj4-hero
  cancel-in-progress: true

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify known-good AJ4 asset
        shell: bash
        run: |
          set -euo pipefail
          test -s qiqishoes-com/assets/aj4-black-500.webp
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          p='qiqishoes-com/assets/aj4-black-500.webp'
          im=Image.open(p); im.verify(); im=Image.open(p)
          print('verified source:', im.format, im.size)
          if im.format != 'WEBP' or im.size != (480,302):
              raise SystemExit(f'Unexpected AJ4 source: {im.format} {im.size}')
          PY

      - name: Restore homepage hero to verified asset
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('qiqishoes-com/index.html')
          s=p.read_text(encoding='utf-8')
          new='src="./assets/aj4-black-500.webp?v=202608170210" alt="黑色 AJ4 鞋款" width="480" height="302"'
          pattern=r'src="\./assets/aj4-black[^\"]+" alt="黑色 AJ4 鞋款" width="\d+" height="\d+"'
          s,n=re.subn(pattern,new,s,count=1)
          if n != 1:
              raise SystemExit(f'Expected one AJ4 hero image tag, found {n}')
          s=re.sub(r'\.hero-shoe\{[^}]*\}', '.hero-shoe{display:block;width:auto;height:auto;max-width:100%;max-height:100%;object-fit:contain;object-position:center;image-rendering:auto}', s, count=1)
          p.write_text(s,encoding='utf-8')
          PY
          grep -F 'aj4-black-500.webp?v=202608170210' qiqishoes-com/index.html >/dev/null

      - name: Commit homepage fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qiqishoes-com/index.html
          git commit -m 'Restore visible verified AJ4 homepage hero'
          git push origin main

      - name: Verify Cloudflare serves visible AJ4 image
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          for i in $(seq 1 72); do
            page=$(curl -fsS --max-time 15 -H 'Cache-Control: no-cache' "https://qiqishoes-com.pages.dev/?verify=202608170210-${i}" || true)
            if printf '%s' "$page" | grep -q 'aj4-black-500.webp?v=202608170210'; then
              curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' \
                "https://qiqishoes-com.pages.dev/assets/aj4-black-500.webp?verify=202608170210-${i}" \
                -o /tmp/live-aj4.webp
              test "$(wc -c < /tmp/live-aj4.webp)" -gt 9000
              python - <<'PY'
          from PIL import Image
          p='/tmp/live-aj4.webp'
          im=Image.open(p); im.verify(); im=Image.open(p)
          print('LIVE HERO VERIFIED:', im.format, im.size)
          if im.format != 'WEBP' or im.size != (480,302):
              raise SystemExit(f'Bad live hero: {im.format} {im.size}')
          PY
              exit 0
            fi
            sleep 5
          done
          echo 'Cloudflare did not publish the verified AJ4 hero within 6 minutes' >&2
          exit 1
