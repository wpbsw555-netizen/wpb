name: Apply Bags Home Image

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-bags-home-image.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild bag homepage image
        shell: bash
        run: |
          set -euo pipefail
          cat \
            qiqishoes-com/assets/catalog/bags/bag-home.part0 \
            qiqishoes-com/assets/catalog/bags/bag-home.part1 \
            qiqishoes-com/assets/catalog/bags/bag-home.part2 \
            qiqishoes-com/assets/catalog/bags/bag-home.part3 \
            qiqishoes-com/assets/catalog/bags/bag-home.part4 \
            qiqishoes-com/assets/catalog/bags/bag-home.part5 \
            > /tmp/bag-home.b64
          base64 -d /tmp/bag-home.b64 > qiqishoes-com/assets/catalog/bags/bags-home-20260816.jpg
          test "$(stat -c '%s' qiqishoes-com/assets/catalog/bags/bags-home-20260816.jpg)" = "61861"
          echo '6e77aa31c2fbf76166cef024390ebb5bcd4774f4f36bb052453968504b11782f  qiqishoes-com/assets/catalog/bags/bags-home-20260816.jpg' | sha256sum -c -
          python -m pip install --quiet pillow
          python -c "from PIL import Image; p='qiqishoes-com/assets/catalog/bags/bags-home-20260816.jpg'; im=Image.open(p); print(im.format, im.size, im.mode); assert im.size==(540,405); im.verify()"

      - name: Replace only bags card image
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('qiqishoes-com/index.html')
          s = p.read_text()
          old = '.dept.bags{--image:url("./assets/catalog/bags/29314.jpg")}'
          new = '.dept.bags{--image:url("./assets/catalog/bags/bags-home-20260816.jpg?v=202608162126")}'
          if old not in s:
              raise SystemExit('Expected bags image CSS not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Commit bags image update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qiqishoes-com/index.html qiqishoes-com/assets/catalog/bags/bags-home-20260816.jpg
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Replace homepage bags card image'
          git push
