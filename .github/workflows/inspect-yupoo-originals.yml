name: Inspect Yupoo Original Images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/inspect_yupoo_original_images.py'
      - '.github/workflows/inspect-yupoo-originals.yml'

permissions:
  contents: write

concurrency:
  group: inspect-yupoo-original-images
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4
      - name: Inspect album detail pages
        run: python scripts/inspect_yupoo_original_images.py
      - name: Commit diagnostic report
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qiqishoes-com/assets/tennis-shoes/original-image-diagnostic.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record Yupoo original-image diagnostic'
            git pull --rebase origin main
            git push
          fi
