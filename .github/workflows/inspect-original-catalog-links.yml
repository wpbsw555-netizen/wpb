name: Inspect Original Catalog Links

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-original-catalog-links.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect links around category images
        shell: bash
        run: |
          python - <<'PY'
          import re, html, urllib.request
          url='https://www.tangma2088.com/categoryen_11.html?path=0_11'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=30) as r:
              raw=r.read(); ct=(r.headers.get('content-type') or '').lower(); final=r.url
          enc='gb18030' if ('gb2312' in ct or 'gbk' in ct) else 'utf-8'
          text=raw.decode(enc,'replace')
          print('FINAL',final,'LEN',len(text))
          # Print first 15 anchors that contain a category image.
          anchors=re.findall(r'<a\b[^>]*href=["\']([^"\']+)["\'][^>]*>(.*?)</a>',text,re.I|re.S)
          n=0
          for href,inner in anchors:
              m=re.search(r'<img\b[^>]*(?:data-original|data-src|src)=["\']([^"\']+)',inner,re.I|re.S)
              if not m: continue
              altm=re.search(r'<img\b[^>]*alt=["\']([^"\']*)',inner,re.I|re.S)
              alt=html.unescape(altm.group(1)) if altm else ''
              print('CARD',n,'HREF=',html.unescape(href),'IMG=',html.unescape(m.group(1)),'ALT=',alt)
              n+=1
              if n>=20: break
          # Also print href patterns count
          hrefs=re.findall(r'href=["\']([^"\']+)',text,re.I)
          pats={}
          for h in hrefs:
              h=html.unescape(h)
              key='other'
              if 'categoryen_' in h:key='category'
              elif 'prodetails' in h.lower() or 'product' in h.lower():key='product'
              pats[key]=pats.get(key,0)+1
          print('HREF PATTERNS',pats)
          PY
