name: Reimport Clean Yupoo Original Images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/reimport_clean_yupoo_originals.py'
      - '.github/workflows/sync-yupoo-tennis.yml'

permissions:
  contents: write

concurrency:
  group: clean-yupoo-original-image-reimport
  cancel-in-progress: true

jobs:
  reimport:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      CLEAN_IMAGE_WORKERS: '4'
      CLEAN_MAX_CANDIDATES: '7'
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install clean-image dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-eng
          python -m pip install --quiet requests beautifulsoup4 pillow pytesseract

      - name: Mark clean-original reimport running
        shell: bash
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          root = Path('qiqishoes-com/assets/tennis-shoes')
          manifest = json.loads((root / 'catalog.json').read_text(encoding='utf-8'))
          categories = manifest.get('categories') or []
          status = {
              'status': 'running',
              'startedAt': datetime.now(timezone.utc).isoformat(),
              'source': 'https://yunnan0594.x.yupoo.com/categories/3551885',
              'totalCategoryCount': len(categories),
              'completedCategoryCount': 0,
              'completedCategories': [],
              'policy': 'Use Yupoo album data-origin-src originals; reject large English/digit overlays',
              'scope': 'sneaker catalog only'
          }
          (root / 'clean-original-reimport-status.json').write_text(
              json.dumps(status, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qiqishoes-com/assets/tennis-shoes/clean-original-reimport-status.json
          if ! git diff --cached --quiet; then
            git commit -m 'Mark clean Yupoo original reimport running'
            git pull --rebase origin main
            git push
          fi

      - name: Build category order
        shell: bash
        run: |
          python - <<'PY' > /tmp/clean-category-ids.txt
          import json
          from pathlib import Path
          manifest = json.loads(Path('qiqishoes-com/assets/tennis-shoes/catalog.json').read_text(encoding='utf-8'))
          ids = [str(item.get('id')) for item in manifest.get('categories', []) if item.get('id')]
          ordered = ['3551885'] + [value for value in ids if value != '3551885']
          print('\n'.join(ordered))
          PY
          echo "Categories to process: $(wc -l < /tmp/clean-category-ids.txt)"

      - name: Replace every category with clean original images
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          while IFS= read -r category_id; do
            [ -n "$category_id" ] || continue
            echo "===== CLEAN ORIGINAL CATEGORY $category_id ====="
            python scripts/reimport_clean_yupoo_originals.py --category "$category_id"

            git add -A qiqishoes-com/assets/tennis-shoes
            if ! git diff --cached --quiet; then
              git commit -m "Replace sneaker category $category_id with clean originals"
              git pull --rebase origin main
              git push
            fi
          done < /tmp/clean-category-ids.txt

      - name: Finalize clean-original catalog
        shell: bash
        run: |
          python scripts/reimport_clean_yupoo_originals.py --finalize
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A qiqishoes-com/assets/tennis-shoes
          if ! git diff --cached --quiet; then
            git commit -m 'Complete clean Yupoo original-image reimport'
            git pull --rebase origin main
            git push
          fi

      - name: Record reimport failure
        if: failure()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          path = Path('qiqishoes-com/assets/tennis-shoes/clean-original-reimport-status.json')
          try:
              status = json.loads(path.read_text(encoding='utf-8'))
          except Exception:
              status = {}
          status['status'] = 'failed'
          status['failedAt'] = datetime.now(timezone.utc).isoformat()
          path.write_text(json.dumps(status, ensure_ascii=False, indent=2), encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qiqishoes-com/assets/tennis-shoes/clean-original-reimport-status.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record clean Yupoo original reimport failure'
            git pull --rebase origin main || true
            git push || true
          fi
