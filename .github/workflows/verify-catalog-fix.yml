name: Verify Catalog Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-catalog-fix.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify all four catalogs stay local and show product images
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request, urllib.parse, re, html, sys

          origin='https://qiqishoes-com.pages.dev'
          targets={
              'fashion':'https://www.tangma2088.com/categoryen_3.html?path=0_3',
              'accessories':'https://acc.tangma2088.com/categoryen_16511.html?path=0_16511',
              'bags':'https://bags.tangma2088.com/categoryen_29314.html?path=0_29314',
              'shoes':'https://shoes.tangma2088.com/categoryen_355.html?path=0_355',
          }

          def get(url, timeout=30):
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Cache-Control':'no-cache','Accept':'*/*'})
              with urllib.request.urlopen(req,timeout=timeout) as r:
                  return r.status, r.headers, r.read(), r.url

          st,hd,app,_=get(origin+'/assets/app.js?verify=all')
          app_text=app.decode('utf-8','replace')
          if 'function localCatalogHref(u)' not in app_text:
              raise SystemExit('Live app.js does not build local catalog URLs')

          for name,target in targets.items():
              proxy=origin+'/catalog-proxy?u='+urllib.parse.quote(target,safe='')+'&verify=all-'+name
              st2,hd2,body,final=get(proxy)
              ctype=hd2.get('content-type','')
              enc='gb18030' if ('gb2312' in ctype.lower() or 'gbk' in ctype.lower()) else 'utf-8'
              text=body.decode(enc,'replace')
              imgs=[]
              for m in re.finditer(r'<img\b[^>]*\bsrc=["\']([^"\']+)',text,re.I):
                  u=html.unescape(m.group(1))
                  decoded=urllib.parse.unquote(u).lower()
                  if '/catalog-proxy?u=' in u and '/upfile/category/' in decoded:
                      imgs.append(u)
              bad=[]
              for m in re.finditer(r'<a\b[^>]*href=["\']([^"\']+)',text,re.I):
                  u=html.unescape(m.group(1))
                  if u.startswith(('http://','https://')):
                      host=(urllib.parse.urlparse(u).hostname or '').lower()
                      if host not in {'qiqishoes-com.pages.dev','wa.me'}:
                          bad.append(u)
              print(name,'status',st2,'product_imgs',len(imgs),'bad_links',len(bad))
              if st2 != 200 or not imgs or bad:
                  raise SystemExit(f'{name} failed: status={st2}, imgs={len(imgs)}, bad={bad[:3]}')
              ist,ih,ib,ifu=get(imgs[0])
              ict=(ih.get('content-type') or '').lower()
              print(name,'product image',ist,ict,len(ib),ifu)
              if ist != 200 or len(ib) <= 1000 or ('image/' not in ict and ib[:3] != b'\xff\xd8\xff'):
                  raise SystemExit(f'{name} product image failed: {ist} {ict} {len(ib)}')

          print('ALL FOUR CATALOGS VERIFIED: local navigation + real product images')
          PY
