name: Apply Shoes Home Image

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-shoes-home-image.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild shoes homepage image
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib
          base = Path('qiqishoes-com/assets/catalog/shoes')
          names = [
              'shoes-home.part0a',
              'shoes-home.part0b',
              'shoes-home.part1',
              'shoes-home.part2',
              'shoes-home.part3',
          ]
          parts = []
          for name in names:
              part = (base / name).read_text().strip()
              print(name, len(part), part[:8], part[-8:])
              parts.append(part)
          s = ''.join(parts)
          print('total b64 len', len(s), 'mod4', len(s) % 4)
          assert len(s) == 25136, len(s)
          raw = base64.b64decode(s, validate=True)
          digest = hashlib.sha256(raw).hexdigest()
          print('decoded bytes', len(raw), 'sha', digest)
          assert len(raw) == 18851, len(raw)
          assert digest == 'ac24cae2f16af051122da606700933a5de307513f884219e627c82475e0dad80', digest
          assert raw[:2] == b'\xff\xd8' and raw[-2:] == b'\xff\xd9'
          out = base / 'shoes-home-20260816.jpg'
          out.write_bytes(raw)
          PY
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          p='qiqishoes-com/assets/catalog/shoes/shoes-home-20260816.jpg'
          im=Image.open(p)
          im.load()
          print('PIL OK', im.format, im.size, im.mode)
          assert im.format == 'JPEG'
          assert im.size == (320, 320)
          PY

      - name: Replace only shoes card image
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('qiqishoes-com/index.html')
          s = p.read_text()
          new = '.dept.shoes{--image:url("./assets/catalog/shoes/shoes-home-20260816.jpg?v=202608162305")}'
          s2, n = re.subn(r'\.dept\.shoes\{--image:url\("[^\"]+"\)\}', new, s, count=1)
          if n != 1:
              raise SystemExit(f'Expected one shoes image CSS rule, replaced {n}')
          p.write_text(s2)
          PY

      - name: Commit shoes image update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qiqishoes-com/index.html qiqishoes-com/assets/catalog/shoes/shoes-home-20260816.jpg
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Replace homepage shoes card image'
          git push
