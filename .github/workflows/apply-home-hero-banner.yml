name: Apply Homepage Hero Banner

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_home_hero_banner.py'
      - '.github/workflows/apply-home-hero-banner.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace homepage hero only
        run: python scripts/apply_home_hero_banner.py

      - name: Commit homepage update
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qiqishoes-com/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Replace homepage hero with user banner'
            git pull --rebase origin main
            git push
          fi
