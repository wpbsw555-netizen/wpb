name: Sync QIQI Catalog Images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/sync_catalog_images.py'
      - '.github/workflows/sync-catalog-images.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade requests pillow
      - name: Download and normalize thumbnails
        run: python scripts/sync_catalog_images.py
      - name: Commit mirrored images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qiqishoes-com/assets/catalog
          if git diff --cached --quiet; then
            echo "No image changes"
          else
            git commit -m "Sync original catalog thumbnails"
            git push
          fi
