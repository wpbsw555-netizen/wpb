name: Sync QIQI Catalog Images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/sync_catalog_images.py'
      - '.github/workflows/sync-catalog-images.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade requests pillow beautifulsoup4
      - name: Download, record and commit thumbnails
        shell: bash
        run: |
          set +e
          python scripts/sync_catalog_images.py > sync-output.log 2>&1
          status=$?
          cat sync-output.log
          mkdir -p qiqishoes-com/assets/catalog
          cp sync-output.log qiqishoes-com/assets/catalog/sync-report.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qiqishoes-com/assets/catalog
          if ! git diff --cached --quiet; then
            git commit -m "Sync original catalog thumbnails"
            git pull --rebase origin main
            git push
          fi
          exit $status
