name: Build AJ4 static image

on:
  push:
    branches: [main]
    paths:
      - 'qiqishoes-com/assets/aj4-black.webp.b64'
      - '.github/workflows/build-aj4-static.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode real WebP asset
        run: |
          base64 -d qiqishoes-com/assets/aj4-black.webp.b64 > qiqishoes-com/assets/aj4-black.webp
          file qiqishoes-com/assets/aj4-black.webp
          test -s qiqishoes-com/assets/aj4-black.webp
      - name: Commit static image if changed
        run: |
          if git diff --quiet -- qiqishoes-com/assets/aj4-black.webp && git ls-files --error-unmatch qiqishoes-com/assets/aj4-black.webp >/dev/null 2>&1; then
            echo 'Static image already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qiqishoes-com/assets/aj4-black.webp
          git commit -m 'Add real static black AJ4 WebP asset'
          git push
