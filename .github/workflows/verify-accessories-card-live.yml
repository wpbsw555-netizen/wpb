name: Verify Accessories Card Live

on:
  push:
    branches: [main]
    paths:
      - 'qiqishoes-com/index.html'
      - 'qiqishoes-com/assets/catalog/accessories/rolex-watch-card-300.jpg'
      - '.github/workflows/verify-accessories-card-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Cloudflare and verify live accessories card
        shell: bash
        run: |
          set -euo pipefail
          HOME_URL='https://qiqishoes-com.pages.dev/'
          IMG_URL='https://qiqishoes-com.pages.dev/assets/catalog/accessories/rolex-watch-card-300.jpg?v=202608130442'
          for i in $(seq 1 24); do
            echo "Attempt $i"
            home=$(curl -fsSL --max-time 20 "$HOME_URL" || true)
            code=$(curl -L -sS -o /tmp/watch.jpg -w '%{http_code}' --max-time 20 "$IMG_URL" || true)
            if [[ "$code" == "200" ]] && grep -q 'rolex-watch-card-300.jpg?v=202608130442' <<<"$home" && [[ -s /tmp/watch.jpg ]]; then
              type=$(file -b --mime-type /tmp/watch.jpg)
              size=$(stat -c '%s' /tmp/watch.jpg)
              echo "image mime=$type size=$size"
              if [[ "$type" == "image/jpeg" ]] && [[ "$size" -gt 10000 ]]; then
                echo 'LIVE_ACCESSORIES_CARD_OK'
                exit 0
              fi
            fi
            sleep 15
          done
          echo 'Live accessories card did not update in time'
          exit 1
