name: Verify Accessories Card Live
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify static accessories image
        run: |
          set -euo pipefail
          curl -fsSL https://qiqishoes-com.pages.dev/ -o /tmp/home.html
          curl -fsSL https://qiqishoes-com.pages.dev/assets/catalog/accessories/rolex-accessories-home-20260815.jpg -o /tmp/watch.jpg
          grep -q 'rolex-accessories-home-20260815.jpg' /tmp/home.html
          test "$(file -b --mime-type /tmp/watch.jpg)" = image/jpeg
          test "$(stat -c '%s' /tmp/watch.jpg)" -gt 20000
