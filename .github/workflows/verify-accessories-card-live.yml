name: Verify Accessories Card Live
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify final static image
        shell: bash
        run: |
          set -euo pipefail
          HOME_URL='https://qiqishoes-com.pages.dev/'
          IMG_URL='https://qiqishoes-com.pages.dev/assets/catalog/accessories/rolex-accessories-home-20260815.jpg'
          home=$(curl -fsSL --max-time 30 "$HOME_URL")
          curl -fsSL --max-time 30 "$IMG_URL" -o /tmp/watch.jpg
          grep -q 'rolex-accessories-home-20260815.jpg' <<<"$home"
          test "$(file -b --mime-type /tmp/watch.jpg)" = 'image/jpeg'
          test "$(stat -c '%s' /tmp/watch.jpg)" -gt 20000
          echo LIVE_STATIC_ACCESSORIES_IMAGE_OK
