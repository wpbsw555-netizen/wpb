name: Verify Catalog Speed

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-catalog-speed.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify four local catalogs are fast and images respond
        shell: bash
        run: |
          python - <<'PY'
          import concurrent.futures, html, re, sys, time, urllib.parse, urllib.request

          origin='https://qiqishoes-com.pages.dev'
          targets={'fashion':'3','accessories':'16511','bags':'29314','shoes':'355'}

          def get(url, timeout=30):
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Cache-Control':'no-cache','Accept':'*/*'})
              t=time.perf_counter()
              with urllib.request.urlopen(req,timeout=timeout) as r:
                  body=r.read(); elapsed=time.perf_counter()-t
                  return r.status,r.headers,body,r.url,elapsed

          ready=False
          for attempt in range(72):
              try:
                  st,hd,body,final,elapsed=get(origin+'/local-catalog?dept=fashion&id=3&page=1')
                  text=body.decode('utf-8','replace')
                  print('deploy check',attempt,st,round(elapsed,3),'STATIC' in text)
                  if st==200 and 'LOCAL SNAPSHOT: STATIC' in text and '每页 24 张' in text:
                      ready=True; break
              except Exception as e:
                  print('deploy check error',repr(e))
              time.sleep(5)
          if not ready: raise SystemExit('New static-snapshot catalog version did not deploy')

          for dept,id_ in targets.items():
              url=f'{origin}/local-catalog?dept={dept}&id={id_}&page=1'
              st,hd,body,final,t1=get(url)
              text=body.decode('utf-8','replace')
              st2,hd2,body2,final2,t2=get(url)
              if st!=200 or st2!=200 or 'LOCAL SNAPSHOT: STATIC' not in text:
                  raise SystemExit(f'{dept} page failed')
              bad=[]
              for m in re.finditer(r'<a\b[^>]*href=["\']([^"\']+)',text,re.I):
                  u=html.unescape(m.group(1))
                  if u.startswith(('http://','https://')):
                      host=(urllib.parse.urlparse(u).hostname or '').lower()
                      if host not in {'qiqishoes-com.pages.dev','wa.me'}: bad.append(u)
              if bad: raise SystemExit(f'{dept} external links remain: {bad[:3]}')
              imgs=[]
              for m in re.finditer(r'<img\b[^>]*src=["\']([^"\']+)',text,re.I):
                  u=html.unescape(m.group(1))
                  if '/catalog-proxy?u=' in u: imgs.append(u)
              if not (1 <= len(imgs) <= 24): raise SystemExit(f'{dept} unexpected page image count {len(imgs)}')

              def check_img(u):
                  s,h,b,f,t=get(u,timeout=30)
                  ct=(h.get('content-type') or '').lower()
                  return s,ct,len(b),t
              with concurrent.futures.ThreadPoolExecutor(max_workers=8) as ex:
                  checks=list(ex.map(check_img,imgs[:8]))
              failed=[x for x in checks if x[0]!=200 or x[2]<700 or ('image/' not in x[1] and x[2]<1500)]
              if failed: raise SystemExit(f'{dept} image checks failed: {failed[:3]}')
              print(dept,'page1',round(t1,3),'page2',round(t2,3),'images',len(imgs),'sample_ok',len(checks))
              if t2 > 4.0: raise SystemExit(f'{dept} cached page still too slow: {t2:.3f}s')

          print('ALL CATALOGS VERIFIED FAST: static snapshots, local navigation, images responding')
          PY
