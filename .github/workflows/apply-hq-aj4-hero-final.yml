name: Apply HQ AJ4 Hero Final
on:
  push:
    branches: [main]
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Update homepage hero reference
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('qiqishoes-com/index.html')
          s=p.read_text(encoding='utf-8')
          new='src="./assets/aj4-black-hq-final.webp?v=202608170055" alt="黑色 AJ4 鞋款" width="620" height="388"'
          pattern=r'src="\./assets/aj4-black[^\"]+" alt="黑色 AJ4 鞋款" width="\d+" height="\d+"'
          s2,n=re.subn(pattern,new,s,count=1)
          if n!=1:
              raise SystemExit('Hero image tag not found')
          p.write_text(s2,encoding='utf-8')
          PY
      - name: Commit homepage change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qiqishoes-com/index.html
          git commit -m "Use clean AJ4 homepage image"
          git push
      - name: Verify Cloudflare published clear hero
        shell: bash
        run: |
          for i in $(seq 1 45); do
            page=$(curl -fsS --max-time 10 "https://qiqishoes-com.pages.dev/?v=202608170055" || true)
            if echo "$page" | grep -q 'aj4-black-hq-final.webp?v=202608170055'; then
              curl -fsS --max-time 15 "https://qiqishoes-com.pages.dev/assets/aj4-black-hq-final.webp?v=202608170055" -o /tmp/hero.webp
              test "$(wc -c < /tmp/hero.webp)" -gt 9000
              file /tmp/hero.webp | grep -qi 'Web/P image'
              exit 0
            fi
            sleep 5
          done
          echo "Cloudflare did not publish the HQ hero within the verification window" >&2
          exit 1
