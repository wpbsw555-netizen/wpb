name: Apply HQ AJ4 Hero Final
on:
  push:
    branches: [main]
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Write high quality AJ4 image and update homepage
        shell: bash
        run: |
          python - <<'PY'
          import base64, pathlib
          b64=''
          img = base64.b64decode(b64)
          out = pathlib.Path('qiqishoes-com/assets/aj4-black-hq-final.webp')
          out.write_bytes(img)
          p = pathlib.Path('qiqishoes-com/index.html')
          s = p.read_text(encoding='utf-8')
          old = 'src="./assets/aj4-black-clear-900.webp?v=202608170029" alt="黑色 AJ4 鞋款" width="900" height="600"'
          new = 'src="./assets/aj4-black-hq-final.webp?v=202608170045" alt="黑色 AJ4 鞋款" width="700" height="438"'
          if old not in s:
              raise SystemExit('Expected current hero reference not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          file qiqishoes-com/assets/aj4-black-hq-final.webp
          test "$(wc -c < qiqishoes-com/assets/aj4-black-hq-final.webp)" -gt 10000
      - name: Commit HQ hero
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qiqishoes-com/index.html qiqishoes-com/assets/aj4-black-hq-final.webp
          git commit -m "Use clean high quality AJ4 homepage image"
          git push
      - name: Verify Cloudflare published HQ hero
        shell: bash
        run: |
          for i in $(seq 1 40); do
            page=$(curl -fsS --max-time 10 "https://qiqishoes-com.pages.dev/?v=202608170045" || true)
            if echo "$page" | grep -q 'aj4-black-hq-final.webp?v=202608170045'; then
              curl -fsS --max-time 15 "https://qiqishoes-com.pages.dev/assets/aj4-black-hq-final.webp?v=202608170045" -o /tmp/hero.webp
              test "$(wc -c < /tmp/hero.webp)" -gt 10000
              file /tmp/hero.webp | grep -qi 'Web/P image'
              exit 0
            fi
            sleep 5
          done
          echo "Cloudflare did not publish the HQ hero within the verification window" >&2
          exit 1
