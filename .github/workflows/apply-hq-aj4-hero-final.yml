name: Fix AJ4 Hero JPG
on:
  push:
    branches: [main]
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build browser-safe high quality AJ4 JPG
        shell: bash
        run: |
          set -euo pipefail
          src="qiqishoes-com/assets/aj4-black-clear-900.webp"
          out="qiqishoes-com/assets/aj4-black-hero-live-20260817.jpg"
          test -s "$src"
          file "$src" | grep -qi 'Web/P image'
          ffmpeg -hide_banner -loglevel error -y -i "$src" -vf "scale=1200:-2:flags=lanczos,unsharp=5:5:0.55:5:5:0" -q:v 2 "$out"
          file "$out" | grep -qi 'JPEG image data'
          test "$(wc -c < "$out")" -gt 50000
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('qiqishoes-com/index.html')
          s=p.read_text(encoding='utf-8')
          new='src="./assets/aj4-black-hero-live-20260817.jpg?v=202608170100" alt="黑色 AJ4 鞋款" width="1200" height="800"'
          pattern=r'src="\./assets/aj4-black[^\"]+" alt="黑色 AJ4 鞋款" width="\d+" height="\d+"'
          s2,n=re.subn(pattern,new,s,count=1)
          if n != 1:
              raise SystemExit('Hero image tag not found')
          p.write_text(s2,encoding='utf-8')
          PY
      - name: Commit hero JPG and homepage reference
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qiqishoes-com/index.html qiqishoes-com/assets/aj4-black-hero-live-20260817.jpg
          git commit -m "Use browser-safe clear AJ4 JPG on homepage"
          git push
      - name: Verify Cloudflare published visible AJ4 JPG
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            page=$(curl -fsS --max-time 12 -H 'Cache-Control: no-cache' "https://qiqishoes-com.pages.dev/?v=202608170100${i}" || true)
            if echo "$page" | grep -q 'aj4-black-hero-live-20260817.jpg?v=202608170100'; then
              curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "https://qiqishoes-com.pages.dev/assets/aj4-black-hero-live-20260817.jpg?v=202608170100${i}" -o /tmp/hero.jpg
              test "$(wc -c < /tmp/hero.jpg)" -gt 50000
              file /tmp/hero.jpg | grep -qi 'JPEG image data'
              ffmpeg -hide_banner -loglevel error -i /tmp/hero.jpg -f null -
              exit 0
            fi
            sleep 5
          done
          echo "Cloudflare did not publish the visible AJ4 JPG within the verification window" >&2
          exit 1
