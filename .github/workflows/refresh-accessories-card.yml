name: Refresh Accessories Card

on:
  push:
    paths:
      - '.github/workflows/refresh-accessories-card.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create fresh accessories image URL
        run: |
          cp qiqishoes-com/assets/catalog/accessories/16511.jpg qiqishoes-com/assets/catalog/accessories/accessories-watch-20260812.jpg
          python - <<'PY'
          from pathlib import Path
          p = Path('qiqishoes-com/index.html')
          s = p.read_text()
          s = s.replace('./assets/catalog/accessories/16511.jpg', './assets/catalog/accessories/accessories-watch-20260812.jpg?v=20260812')
          p.write_text(s)
          PY
      - name: Commit refreshed accessories card
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qiqishoes-com/index.html qiqishoes-com/assets/catalog/accessories/accessories-watch-20260812.jpg
          git commit -m 'Refresh homepage accessories watch card' || exit 0
          git push
