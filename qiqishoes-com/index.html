<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="QIQI YG SHEET global fashion product catalog" />
  <title>QIQI YG SHEET</title>
  <style>
    :root{--blue:#0878e8;--blue2:#086ed5;--line:#dfe4ea;--text:#15191f;--muted:#5f6773;--bg:#fff;--soft:#f4f7fa;--wa:#24c76f}
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,"Microsoft YaHei",sans-serif;font-size:14px}
    a{color:inherit;text-decoration:none}
    button,input,select{font:inherit}
    .site-header{border-bottom:1px solid var(--line);background:#fff}
    .header-main{height:104px;max-width:1180px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:0 18px}
    .logo{display:flex;align-items:center;gap:12px;min-width:250px}
    .logo-mark{width:70px;height:70px;position:relative;display:grid;place-items:center}
    .logo-mark:before{content:"";width:64px;height:52px;border-radius:55% 45% 52% 48%;background:linear-gradient(150deg,#252525,#6c6c6c 55%,#202020);transform:rotate(-18deg);box-shadow:inset -7px -6px 0 rgba(255,255,255,.18)}
    .logo-mark:after{content:"";position:absolute;width:31px;height:44px;background:#fff;border-radius:55% 30% 62% 38%;transform:rotate(28deg);left:22px;top:15px;clip-path:polygon(0 0,100% 0,72% 43%,100% 100%,12% 100%,32% 52%)}
    .logo-copy strong{display:block;font-size:27px;letter-spacing:5px;font-weight:800;line-height:1.05}
    .logo-copy span{display:block;color:#4f4f4f;letter-spacing:6px;font-size:13px;margin-top:7px}
    .header-actions{display:flex;align-items:center;gap:34px;flex-wrap:wrap;justify-content:flex-end}
    .quick-links{display:flex;gap:35px;font-size:14px}
    .quick-links a:hover{color:var(--blue)}
    .languages{display:flex;gap:8px;color:#454b54}
    .languages button{border:0;background:none;padding:3px 0;cursor:pointer;color:inherit}
    .languages button.active{color:var(--blue);font-weight:700}
    .nav{height:49px;background:var(--blue);color:#fff}
    .nav-inner{max-width:1180px;height:100%;margin:auto;display:flex;align-items:center;padding:0 18px;gap:36px}
    .nav a{font-size:15px;white-space:nowrap}
    .nav a:hover{opacity:.82}
    .wrap{max-width:1180px;margin:auto;padding:14px 18px 90px}
    .search-row{display:flex;justify-content:flex-end;align-items:center;margin-bottom:14px}
    .search-wrap{display:flex;width:360px;height:32px;border:1px solid #bfc5cc;border-radius:5px;overflow:hidden;background:#fff}
    .search-wrap select{border:0;border-right:1px solid #d4d8dd;background:#f7f7f8;width:70px;padding-left:10px;outline:0}
    .search-wrap input{border:0;outline:0;flex:1;padding:0 12px;color:#222;min-width:0}
    .search-wrap button{width:47px;border:0;background:#fff;cursor:pointer;display:grid;place-items:center}
    .search-wrap svg{width:18px;height:18px}
    .section-title{font-size:19px;margin:0 0 10px;font-weight:700}
    .category-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
    .category-card{border:1px solid #dce1e6;border-radius:5px;overflow:hidden;background:#fff;transition:.18s ease;cursor:pointer;min-width:0}
    .category-card:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(26,52,79,.12);border-color:#a9c8e7}
    .thumb{height:148px;background:#f1f3f5;position:relative;overflow:hidden;display:grid;place-items:center}
    .thumb img{width:100%;height:100%;object-fit:cover;display:block}
    .thumb .fallback{position:absolute;inset:0;display:grid;place-items:center;padding:15px;text-align:center;background:linear-gradient(135deg,#f3f4f6,#dfe5ea);font-weight:700;color:#69717b;z-index:-1}
    .card-body{padding:10px 10px 9px}
    .card-name{font-size:14px;font-weight:700;line-height:1.35;min-height:20px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .card-count{color:#555d67;font-size:12px;margin-top:7px}
    .card-id{font-size:12px;color:#252a30;margin-top:8px}
    .no-results{display:none;padding:48px 10px;text-align:center;color:#616975;border:1px dashed #c8cfd6;border-radius:7px;background:#fafbfc}
    .footer{border-top:1px solid var(--line);padding:23px 18px 30px;text-align:center;color:#6a727d;font-size:12px;line-height:1.7}
    .whatsapp{position:fixed;right:28px;bottom:27px;background:var(--wa);color:#fff;border-radius:6px;padding:14px 18px;box-shadow:0 8px 23px rgba(0,0,0,.2);display:flex;align-items:center;gap:10px;font-weight:700;z-index:10}
    .whatsapp svg{width:23px;height:23px;fill:#fff}
    .sync-note{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:#18202a;color:#fff;border-radius:6px;padding:10px 16px;opacity:0;pointer-events:none;transition:.25s;z-index:20;box-shadow:0 8px 25px rgba(0,0,0,.18)}
    .sync-note.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:1050px){.category-grid{grid-template-columns:repeat(5,minmax(0,1fr))}.header-actions{gap:18px}.quick-links{gap:18px}.nav-inner{gap:22px;overflow-x:auto}}
    @media(max-width:760px){.header-main{height:auto;min-height:100px;align-items:flex-start;gap:15px;padding-top:16px;padding-bottom:14px}.logo{min-width:auto}.logo-mark{width:52px;height:57px;transform:scale(.78);transform-origin:left center}.logo-copy strong{font-size:20px;letter-spacing:3px}.logo-copy span{font-size:10px;letter-spacing:4px}.header-actions{display:block;text-align:right}.quick-links{display:grid;grid-template-columns:1fr 1fr;gap:8px 18px}.languages{justify-content:flex-end;margin-top:12px}.category-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.thumb{height:150px}.search-row{justify-content:stretch}.search-wrap{width:100%}.whatsapp{right:15px;bottom:15px;padding:12px 14px}}
    @media(max-width:480px){.header-main{display:block}.header-actions{text-align:left;margin-top:8px}.languages{justify-content:flex-start}.category-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.thumb{height:155px}.nav-inner{padding:0 12px}.wrap{padding-left:10px;padding-right:10px}.whatsapp span{display:none}.whatsapp{border-radius:50%;width:54px;height:54px;padding:0;justify-content:center}.whatsapp svg{width:28px;height:28px}}
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-main">
      <a class="logo" href="#" aria-label="QIQI YG SHEET">
        <span class="logo-mark" aria-hidden="true"></span>
        <span class="logo-copy"><strong>QIQI YG</strong><span>SHEET</span></span>
      </a>
      <div class="header-actions">
        <nav class="quick-links" aria-label="Quick links">
          <a href="#categories" data-i18n="fashion">时尚链接</a>
          <a href="#categories" data-i18n="accessory">饰品链接</a>
          <a href="#categories" data-i18n="bags">箱包链接</a>
          <a href="#categories" data-i18n="shoes">鞋子链接</a>
        </nav>
        <div class="languages" aria-label="Language selection">
          <button class="active" type="button" data-lang="zh">中文</button><span>|</span>
          <button type="button" data-lang="en">English</button><span>|</span>
          <button type="button" data-lang="es">Español</button>
        </div>
      </div>
    </div>
    <nav class="nav" aria-label="Primary navigation">
      <div class="nav-inner">
        <a href="#" data-i18n="home">主页</a>
        <a href="#categories" data-filter="new" data-i18n="new">新品</a>
        <a href="#categories" data-filter="bikini" data-i18n="bikini">比基尼</a>
        <a href="#categories" data-filter="dress" data-i18n="dress">连衣裙</a>
        <a href="#categories" data-filter="ralph">Ralph Lauren</a>
        <a href="#categories" data-filter="lacoste">Lacoste</a>
        <a href="#categories" data-filter="high quality">High Quality</a>
      </div>
    </nav>
  </header>

  <main class="wrap">
    <div class="search-row">
      <form class="search-wrap" id="searchForm">
        <select id="searchType" aria-label="Search type"><option value="all">All</option><option value="id">ID</option><option value="name">Name</option></select>
        <input id="searchInput" type="search" autocomplete="off" placeholder="ID / Description" aria-label="Search products" />
        <button type="submit" aria-label="Search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
        </button>
      </form>
    </div>

    <section id="categories">
      <h1 class="section-title" data-i18n="category">分类</h1>
      <div class="category-grid" id="categoryGrid"></div>
      <div class="no-results" id="noResults" data-i18n="nothing">没有找到匹配的分类</div>
    </section>
  </main>

  <footer class="footer">
    <div>qiqishoes.com · Global fashion catalog</div>
    <div>© 2026 QIQI YG SHEET. WhatsApp: +86 13159065939</div>
  </footer>

  <a class="whatsapp" href="https://wa.me/8613159065939?text=Hello%2C%20I%20want%20to%20ask%20about%20a%20product" target="_blank" rel="noopener noreferrer" aria-label="Chat on WhatsApp">
    <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M19.11 17.55c-.25-.13-1.47-.72-1.7-.81-.23-.08-.4-.13-.57.13-.17.25-.65.81-.8.98-.15.17-.3.19-.55.06-.25-.13-1.06-.39-2.02-1.25-.75-.67-1.25-1.49-1.4-1.74-.15-.25-.02-.38.11-.51.12-.11.25-.3.38-.45.13-.15.17-.25.25-.42.08-.17.04-.32-.02-.45-.06-.13-.57-1.38-.78-1.89-.21-.5-.42-.43-.57-.44h-.49c-.17 0-.45.06-.68.32-.23.25-.89.87-.89 2.13s.91 2.47 1.04 2.64c.13.17 1.79 2.73 4.34 3.83.61.26 1.08.42 1.45.54.61.19 1.16.16 1.6.1.49-.07 1.47-.6 1.68-1.18.21-.58.21-1.08.15-1.18-.06-.11-.23-.17-.48-.3M16.04 27.5h-.01a11.43 11.43 0 0 1-5.83-1.6l-.42-.25-4.33 1.14 1.16-4.22-.27-.43a11.45 11.45 0 1 1 9.7 5.36m9.73-21.18A13.68 13.68 0 0 0 16.06 2.3C8.52 2.3 2.38 8.43 2.38 15.98c0 2.41.63 4.76 1.82 6.83L2.27 29.9l7.25-1.9a13.69 13.69 0 0 0 6.53 1.66h.01c7.54 0 13.68-6.14 13.68-13.69 0-3.65-1.42-7.08-4-9.66"></path></svg>
    <span>联系 WhatsApp</span>
  </a>
  <div class="sync-note" id="syncNote">该分类的产品正在同步中</div>

  <script>
    const categories = [
      {id:'3',name:'2025 New 0722',count:'86,697',tags:'new fashion',img:'https://qiqiygsheet.com/catalog/fashion/3.png'},
      {id:'1580',name:'By Style 0722',count:'664,614',tags:'style fashion',img:'https://qiqiygsheet.com/catalog/fashion/1580.jpg'},
      {id:'11',name:'T Shirt 0722',count:'313,620',tags:'t shirt top',img:'https://qiqiygsheet.com/catalog/fashion/11.jpg'},
      {id:'139496',name:'High Quality 0717',count:'104,546',tags:'high quality',img:'https://qiqiygsheet.com/catalog/fashion/139496.jpg'},
      {id:'10',name:'Polo Shirt 0715',count:'45,404',tags:'polo shirt lacoste ralph',img:'https://qiqiygsheet.com/catalog/fashion/10.jpg'},
      {id:'394',name:'Jacket 0721',count:'82,421',tags:'jacket coat',img:'https://qiqiygsheet.com/catalog/fashion/394.jpg'},
      {id:'87630',name:'Down Jacket 0720',count:'28,827',tags:'down jacket coat',img:'https://qiqiygsheet.com/catalog/fashion/87630.jpeg'},
      {id:'58658',name:'Bikini 0613',count:'13,503',tags:'bikini swimwear',img:'https://qiqiygsheet.com/catalog/fashion/58658.jpg'},
      {id:'155306',name:'Fashion Dress 0714',count:'5,873',tags:'fashion dress',img:'https://qiqiygsheet.com/catalog/fashion/155306.jpg'},
      {id:'41628',name:'Lululemon ALO 不接急单',count:'38,523',tags:'lululemon alo sports',img:'https://qiqiygsheet.com/catalog/fashion/41628.jpg'},
      {id:'1595',name:'Louis Vuitton',count:'64,591',tags:'bag fashion',img:'https://qiqiygsheet.com/catalog/fashion/1595.png'},
      {id:'1602',name:'Gucci',count:'21,179',tags:'fashion bag',img:'https://qiqiygsheet.com/catalog/fashion/1602.jpg'},
      {id:'65045',name:'AF HOC',count:'1,780',tags:'fashion',img:'https://qiqiygsheet.com/catalog/fashion/65045.jpg'},
      {id:'1618',name:'Adidas NIKE Jordan',count:'26,115',tags:'shoes sneaker adidas nike jordan',img:'https://qiqiygsheet.com/catalog/fashion/1618.png'}
    ];

    const translations={
      zh:{fashion:'时尚链接',accessory:'饰品链接',bags:'箱包链接',shoes:'鞋子链接',home:'主页',new:'新品',bikini:'比基尼',dress:'连衣裙',category:'分类',nothing:'没有找到匹配的分类',whatsapp:'联系 WhatsApp',placeholder:'ID / 描述'},
      en:{fashion:'Fashion Link',accessory:'Accessory Link',bags:'Bags Link',shoes:'Shoes Link',home:'Home',new:'New Products',bikini:'Bikini',dress:'Dress',category:'Category',nothing:'No matching category found',whatsapp:'Chat on WhatsApp',placeholder:'ID / Description'},
      es:{fashion:'Moda',accessory:'Accesorios',bags:'Bolsos',shoes:'Zapatos',home:'Inicio',new:'Nuevos productos',bikini:'Bikini',dress:'Vestidos',category:'Categoría',nothing:'No se encontró ninguna categoría',whatsapp:'Contactar por WhatsApp',placeholder:'ID / Descripción'}
    };

    const grid=document.getElementById('categoryGrid');
    const noResults=document.getElementById('noResults');
    const input=document.getElementById('searchInput');
    const type=document.getElementById('searchType');
    const note=document.getElementById('syncNote');

    function render(items){
      grid.innerHTML=items.map(item=>`<article class="category-card" tabindex="0" role="link" data-id="${item.id}" data-name="${item.name}">
        <div class="thumb"><div class="fallback">${item.name}</div><img loading="lazy" src="${item.img}" alt="${item.name}" onerror="this.style.display='none'"></div>
        <div class="card-body"><div class="card-name">${item.name}</div><div class="card-count">(${item.count} products)</div><div class="card-id">ID: ${item.id}</div></div>
      </article>`).join('');
      noResults.style.display=items.length?'none':'block';
      document.querySelectorAll('.category-card').forEach(card=>{
        const open=()=>{note.textContent=`${card.dataset.name} · 产品正在同步中`;note.classList.add('show');setTimeout(()=>note.classList.remove('show'),1800)};
        card.addEventListener('click',open);card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}})
      });
    }

    function search(query){
      const q=query.trim().toLowerCase();
      if(!q){render(categories);return}
      const mode=type.value;
      render(categories.filter(item=>{
        if(mode==='id')return item.id.includes(q);
        if(mode==='name')return (item.name+' '+item.tags).toLowerCase().includes(q);
        return item.id.includes(q)||(item.name+' '+item.tags).toLowerCase().includes(q);
      }));
    }

    document.getElementById('searchForm').addEventListener('submit',e=>{e.preventDefault();search(input.value)});
    input.addEventListener('input',()=>search(input.value));
    document.querySelectorAll('[data-filter]').forEach(link=>link.addEventListener('click',()=>{input.value=link.dataset.filter;search(input.value)}));
    document.querySelectorAll('[data-lang]').forEach(btn=>btn.addEventListener('click',()=>{
      document.querySelectorAll('[data-lang]').forEach(b=>b.classList.remove('active'));btn.classList.add('active');
      const dict=translations[btn.dataset.lang];document.documentElement.lang=btn.dataset.lang==='zh'?'zh-CN':btn.dataset.lang;
      document.querySelectorAll('[data-i18n]').forEach(el=>{const key=el.dataset.i18n;if(dict[key])el.textContent=dict[key]});
      document.querySelector('.whatsapp span').textContent=dict.whatsapp;input.placeholder=dict.placeholder;
    }));
    render(categories);
  </script>
</body>
</html>
