<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="QIQI SHOES fashion and footwear catalog">
  <title>QIQI SHOES Catalog</title>
  <link rel="stylesheet" href="./assets/styles.css">
</head>
<body data-department="fashion">
  <div class="site">
    <header class="top">
      <a class="brand" href="./" aria-label="QIQI SHOES">
        <span class="brand-cn" id="brandCn">服饰</span><span class="brand-en" id="brandEn">FASHION</span>
      </a>
      <div class="top-right">
        <nav class="portal-tabs" aria-label="商品部门">
          <a class="portal-tab" data-department="fashion" href="./fashion/">时尚链接</a>
          <a class="portal-tab" data-department="accessories" href="./accessories/">附件链接</a>
          <a class="portal-tab" data-department="bags" href="./bags/">包包链接</a>
          <a class="portal-tab" data-department="shoes" href="./shoes/">鞋子链接</a>
        </nav>
        <div class="langs">
          <button type="button" data-lang="zh">中文</button> |
          <button type="button" data-lang="en">英语</button> |
          <button type="button" data-lang="es">西班牙语</button>
        </div>
      </div>
    </header>

    <div class="rule"></div>
    <nav class="nav" id="categoryNav" aria-label="分类导航"></nav>

    <div class="tools">
      <div class="breadcrumb" id="breadcrumb">家</div>
      <div class="order-guide">
        <div class="question">?</div>
        <div class="order-copy"><strong id="guideTitle">如何订购</strong><small id="guideSmall">查看订购指南</small></div>
        <div class="order-arrow">›</div>
      </div>
      <form class="search" id="searchForm">
        <select id="searchType" aria-label="搜索类型">
          <option value="all">全部</option>
          <option value="id">ID</option>
          <option value="name">描述</option>
        </select>
        <input id="searchInput" type="search" autocomplete="off" placeholder="ID/描述" aria-label="搜索商品">
        <button id="searchBtn" type="submit">搜索</button>
      </form>
    </div>

    <main>
      <div class="section-bar" id="sectionTitle">款式 0724</div>
      <a class="back" id="backBtn" href="javascript:history.back()">←返回上一关</a>
      <section class="product-grid" id="productGrid" aria-live="polite"></section>
      <div class="no-results" id="noResults">没有找到匹配的商品</div>
    </main>

    <footer id="footerText">QIQI SHOES 商品目录 · WhatsApp：+86 13159065939</footer>
  </div>

  <a class="wa" href="https://wa.me/8613159065939?text=Hello%2C%20I%20want%20to%20ask%20about%20a%20product" target="_blank" rel="noopener noreferrer">
    <span class="wa-icon">☎</span><span id="waText">在 WhatsApp 上聊天</span>
  </a>

  <script src="./assets/app.js"></script>
</body>
</html>
